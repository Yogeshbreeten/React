<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <div class="container">
    <h1>BMI CALCULATOR</h1>
    <form>
        <p><lable>Height in CM:</lable><input type="text" id="height"></p>
        <p><lable>  Weight in KG:</lable><input type="text" id="weight"></p>
        <button>Calculate:</button>
    </form>
   </div>
   <div id="results"></div>
</body>
<script>
const form=document.querySelector('form');
form.addEventListener('sumbit',function(e){
    e.preventDefault();
    const height=parseInt(document.querySelector('#height').value);
    const weight=parseInt(document.querySelector("#weight").value);
    const results=document.querySelector("#results");

if(height===" "||height<0||isNaN(height)){
    results.innerHTML="please give me correct height";
}
else if(weight===" "||weight<0||isNaN(weight)){
    results.innerHTML="please give me correct weight";
}
else{
   const bmi= (weight/((height*height)/10000)).toFixed(2);
   results.innerHTML=`<span>${bmi}</span>`
}
}
)
</script>
</html>
