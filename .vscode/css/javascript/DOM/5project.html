<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Yogesh Khadka</h1>
    <button id="stop">Stop</button>
</body>
<script>
    setTimeout(function(){
        console.log("yogesh");
    },2000);
    const changeText=function(){
        document.querySelector('h1').innerHTML="Breeten Khadka"
    }
    const changeme=setTimeout(changeText,3000);
    //using clearTimeout using the event
    const cl=document.querySelector('#stop');
    cl.addEventListener('click',function(){
        clearTimeout(changeme);
        console.log("Stopped");
    })

</script>
</html>
